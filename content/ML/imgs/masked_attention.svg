<svg width="100%" viewBox="0 0 700 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Masked attention versus standard cross-attention</title>
<desc>Left: a query attends to every image-feature token, so background dominates the softmax. Right: masked attention restricts the query to only the foreground cells of the previous layer's predicted mask, setting all other logits to negative infinity.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,sans-serif}
.panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.att{fill:var(--pf);stroke:var(--ps);stroke-width:1.1}
.msk{fill:var(--gf);stroke:var(--gs);stroke-width:1}
.q{fill:var(--tf);stroke:var(--ts);stroke-width:1.2}
.arw{stroke:var(--ps);stroke-width:1.6;fill:none}
.title{font-size:14.5px;font-weight:600;fill:var(--ink)}
.sub{font-size:11.5px;fill:var(--legend)}
.cell{font-size:10px;fill:var(--gt)}
.qt{font-size:12.5px;font-weight:500;fill:var(--tt)}
.leg{font-size:11.5px;fill:var(--legend)}
:root{--ink:#20201a;--line:#73726c;--legend:#5f5e5a;
--pf:#eeedfe;--ps:#534ab7;--pt:#3c3489;
--tf:#dcf5f0;--ts:#1e8a76;--tt:#126555;
--gf:#eceae3;--gs:#a8a69d;--gt:#8a887f}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--line:#a8a69d;--legend:#cbc9c0;
--pf:#2b2552;--ps:#9387e6;--pt:#d2ccf7;
--tf:#123c36;--ts:#5fc9b4;--tt:#8fe4d3;
--gf:#2a2924;--gs:#6f6d65;--gt:#9a988f}}
</style>
</defs>

<!-- ========= LEFT: standard cross-attention ========= -->
<rect class="panel" x="18" y="40" width="316" height="300" rx="8"/>
<text class="title" x="34" y="66">Standard cross-attention</text>
<text class="sub" x="34" y="84">softmax over all H·W tokens</text>

<!-- grid 5x4, all attended -->
<g>
<rect class="att" x="96"  y="98"  width="34" height="34"/><rect class="att" x="130" y="98"  width="34" height="34"/><rect class="att" x="164" y="98"  width="34" height="34"/><rect class="att" x="198" y="98"  width="34" height="34"/><rect class="att" x="232" y="98"  width="34" height="34"/>
<rect class="att" x="96"  y="132" width="34" height="34"/><rect class="att" x="130" y="132" width="34" height="34"/><rect class="att" x="164" y="132" width="34" height="34"/><rect class="att" x="198" y="132" width="34" height="34"/><rect class="att" x="232" y="132" width="34" height="34"/>
<rect class="att" x="96"  y="166" width="34" height="34"/><rect class="att" x="130" y="166" width="34" height="34"/><rect class="att" x="164" y="166" width="34" height="34"/><rect class="att" x="198" y="166" width="34" height="34"/><rect class="att" x="232" y="166" width="34" height="34"/>
<rect class="att" x="96"  y="200" width="34" height="34"/><rect class="att" x="130" y="200" width="34" height="34"/><rect class="att" x="164" y="200" width="34" height="34"/><rect class="att" x="198" y="200" width="34" height="34"/><rect class="att" x="232" y="200" width="34" height="34"/>
</g>
<text class="sub" x="176" y="252" text-anchor="middle">every token contributes</text>

<!-- query + arrow -->
<rect class="q" x="131" y="292" width="90" height="30" rx="6"/>
<text class="qt" x="176" y="311" text-anchor="middle">query Qₗ</text>
<path class="arw" d="M176 292 L176 238" marker-end="url(#a)"/>

<!-- ========= RIGHT: masked attention ========= -->
<rect class="panel" x="366" y="40" width="316" height="300" rx="8"/>
<text class="title" x="382" y="66">Masked attention</text>
<text class="sub" x="382" y="84">attend only where Mₗ₋₁ = 1</text>

<!-- grid 5x4: foreground blob attended, rest = -inf -->
<g>
<!-- row0 -->
<rect class="msk" x="444" y="98"  width="34" height="34"/><rect class="msk" x="478" y="98"  width="34" height="34"/><rect class="att" x="512" y="98"  width="34" height="34"/><rect class="msk" x="546" y="98"  width="34" height="34"/><rect class="msk" x="580" y="98"  width="34" height="34"/>
<!-- row1 -->
<rect class="msk" x="444" y="132" width="34" height="34"/><rect class="att" x="478" y="132" width="34" height="34"/><rect class="att" x="512" y="132" width="34" height="34"/><rect class="att" x="546" y="132" width="34" height="34"/><rect class="msk" x="580" y="132" width="34" height="34"/>
<!-- row2 -->
<rect class="msk" x="444" y="166" width="34" height="34"/><rect class="att" x="478" y="166" width="34" height="34"/><rect class="att" x="512" y="166" width="34" height="34"/><rect class="att" x="546" y="166" width="34" height="34"/><rect class="msk" x="580" y="166" width="34" height="34"/>
<!-- row3 -->
<rect class="msk" x="444" y="200" width="34" height="34"/><rect class="msk" x="478" y="200" width="34" height="34"/><rect class="att" x="512" y="200" width="34" height="34"/><rect class="att" x="546" y="200" width="34" height="34"/><rect class="msk" x="580" y="200" width="34" height="34"/>
<!-- -inf labels on masked cells -->
<text class="cell" x="461" y="119" text-anchor="middle">−∞</text><text class="cell" x="495" y="119" text-anchor="middle">−∞</text><text class="cell" x="563" y="119" text-anchor="middle">−∞</text><text class="cell" x="597" y="119" text-anchor="middle">−∞</text>
<text class="cell" x="461" y="153" text-anchor="middle">−∞</text><text class="cell" x="597" y="153" text-anchor="middle">−∞</text>
<text class="cell" x="461" y="187" text-anchor="middle">−∞</text><text class="cell" x="597" y="187" text-anchor="middle">−∞</text>
<text class="cell" x="461" y="221" text-anchor="middle">−∞</text><text class="cell" x="495" y="221" text-anchor="middle">−∞</text><text class="cell" x="597" y="221" text-anchor="middle">−∞</text>
</g>
<text class="sub" x="524" y="252" text-anchor="middle">only prev-mask foreground</text>

<!-- query + arrow -->
<rect class="q" x="479" y="292" width="90" height="30" rx="6"/>
<text class="qt" x="524" y="311" text-anchor="middle">query Qₗ</text>
<path class="arw" d="M524 292 L524 238" marker-end="url(#a)"/>

<!-- legend -->
<rect class="att" x="34" y="20" width="14" height="14"/><text class="leg" x="54" y="31">attended token</text>
<rect class="msk" x="182" y="20" width="14" height="14"/><text class="leg" x="202" y="31">masked out (logit → −∞)</text>
</svg>

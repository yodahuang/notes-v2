<svg width="100%" viewBox="0 0 680 370" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DETR decoder layer: composition of Q, K, V from decoder embedding X, object query P, and encoder memory</title>
<desc>One DETR decoder layer. The decoder embedding X flows through self-attention, cross-attention and FFN as a residual stream; the object query P is re-added to Q and K at every attention layer but never to V. Cross-attention keys and values come from the encoder memory, with spatial positional encoding added to keys only.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,sans-serif}
.box{stroke-width:1.1}
.arw{stroke:var(--line);stroke-width:1.6;fill:none}
.arw-x{stroke:var(--ps);stroke-width:1.8;fill:none}
.arw-p{stroke:var(--os);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.arw-m{stroke:var(--ts);stroke-width:1.6;fill:none}
.r-p{fill:var(--pf);stroke:var(--ps)}.k-p{fill:var(--pt)}
.r-o{fill:var(--of);stroke:var(--os)}.k-o{fill:var(--ot)}
.r-t{fill:var(--tf);stroke:var(--ts)}.k-t{fill:var(--tt)}
.r-g{fill:var(--gf);stroke:var(--gs)}.k-g{fill:var(--gt)}
.title{font-size:14.5px;font-weight:500}
.sub{font-size:11.5px}
.eq{font-size:12.5px;fill:var(--ink)}
.xp{fill:var(--ps);font-weight:600}.pp{fill:var(--os);font-weight:600}.mp{fill:var(--ts);font-weight:600}.gp{fill:var(--gt);font-weight:600}
.leg{font-size:12px;fill:var(--legend)}
.dim{font-size:11px;fill:var(--legend)}
:root{--ink:#20201a;--line:#73726c;--legend:#5f5e5a;
--pf:#eeedfe;--ps:#534ab7;--pt:#3c3489;
--of:#fdeee0;--os:#b05f14;--ot:#8a4c10;
--tf:#e2f3ef;--ts:#20776a;--tt:#175a50;
--gf:#efeeea;--gs:#8a8880;--gt:#5f5e5a}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--line:#a8a69d;--legend:#cbc9c0;
--pf:#2b2552;--ps:#9387e6;--pt:#d2ccf7;
--of:#40301a;--os:#e0954a;--ot:#f0c391;
--tf:#1a3a34;--ts:#5fbfae;--tt:#a9e2d7;
--gf:#2e2d29;--gs:#8a8880;--gt:#cbc9c0}}
</style>
</defs>

<!-- input chips -->
<rect class="box r-p" x="20" y="20" width="180" height="46" rx="8"/>
<text class="title k-p" x="110" y="39" text-anchor="middle">X — decoder embedding</text>
<text class="sub k-p" x="110" y="56" text-anchor="middle">residual stream · init 0 · updated</text>

<rect class="box r-o" x="220" y="20" width="170" height="46" rx="8"/>
<text class="title k-o" x="305" y="39" text-anchor="middle">P — object query</text>
<text class="sub k-o" x="305" y="56" text-anchor="middle">learned · fixed at every layer</text>

<rect class="box r-t" x="410" y="20" width="150" height="46" rx="8"/>
<text class="title k-t" x="485" y="39" text-anchor="middle">mem</text>
<text class="sub k-t" x="485" y="56" text-anchor="middle">encoder output</text>

<rect class="box r-g" x="580" y="20" width="80" height="46" rx="8"/>
<text class="title k-g" x="620" y="39" text-anchor="middle">PE</text>
<text class="sub k-g" x="620" y="56" text-anchor="middle">spatial, sine</text>

<!-- self-attn block -->
<rect class="box r-p" x="20" y="120" width="290" height="116" rx="10" fill-opacity="0.45"/>
<text class="title k-p" x="165" y="143" text-anchor="middle">self-attention (100 slots)</text>
<text class="eq" x="48" y="168">Q = <tspan class="xp">X</tspan> + <tspan class="pp">P</tspan></text>
<text class="eq" x="48" y="188">K = <tspan class="xp">X</tspan> + <tspan class="pp">P</tspan></text>
<text class="eq" x="48" y="208">V = <tspan class="xp">X</tspan>  <tspan class="dim">(P never enters values)</tspan></text>

<!-- cross-attn block -->
<rect class="box r-t" x="370" y="120" width="290" height="116" rx="10" fill-opacity="0.45"/>
<text class="title k-t" x="515" y="143" text-anchor="middle">cross-attention (slots → image)</text>
<text class="eq" x="398" y="168">Q = <tspan class="xp">X</tspan> + <tspan class="pp">P</tspan></text>
<text class="eq" x="398" y="188">K = <tspan class="mp">mem</tspan> + <tspan class="gp">PE</tspan></text>
<text class="eq" x="398" y="208">V = <tspan class="mp">mem</tspan>  <tspan class="dim">(PE never enters values)</tspan></text>

<!-- flows -->
<path class="arw-x" d="M110 66 V120" marker-end="url(#a)"/>
<path class="arw-p" d="M285 66 V120" marker-end="url(#a)"/>
<path class="arw-p" d="M325 66 V96 H440 V120" marker-end="url(#a)"/>
<path class="arw-m" d="M485 66 V120" marker-end="url(#a)"/>
<path class="arw" d="M620 66 V96 H560 V120" marker-end="url(#a)"/>

<path class="arw-x" d="M310 168 H370" marker-end="url(#a)"/>
<text class="dim" x="340" y="160" text-anchor="middle">X′</text>

<!-- FFN + loop -->
<path class="arw-x" d="M515 236 V270" marker-end="url(#a)"/>
<rect class="box r-p" x="430" y="270" width="170" height="40" rx="8"/>
<text class="title k-p" x="515" y="295" text-anchor="middle">FFN → updated X</text>
<path class="arw-x" d="M430 290 H110 V242" marker-end="url(#a)"/>
<text class="leg" x="265" y="282" text-anchor="middle">X carries content to the next layer; P is re-added fresh each time</text>

<!-- footnote -->
<text class="leg" x="340" y="340" text-anchor="middle">Layer 1: X = 0, so Q ≈ P alone — the first cross-attention output (a mix of encoder features)</text>
<text class="leg" x="340" y="358" text-anchor="middle">overwrites X, placing it in the same space as image features.  (App. A.1 Eq. 7, A.3, Fig. 10)</text>
</svg>

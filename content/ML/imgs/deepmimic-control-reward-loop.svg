<svg width="100%" viewBox="-10 0 690 600" role="img" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, system-ui, &quot;Segoe UI&quot;, sans-serif">
<title>DeepMimic control and reward loop</title>
<desc>The policy reads the state (including phase), emits PD target angles, and the physics engine runs forward dynamics to produce the realized next pose, which closes the loop. Separately, the simulated pose and the reference pose (the clip sampled at the same phase) are each pushed through forward kinematics into a common world-space, where they are compared to give the imitation reward.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- top dashed: shared phase -->
<line x1="255" y1="46" x2="445" y2="46" stroke="rgb(156,154,146)" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="350" y="36" text-anchor="middle" font-size="11" fill="rgb(180,178,169)">shared phase φ</text>

<!-- State -->
<rect x="45" y="20" width="210" height="52" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="1"/>
<text x="150" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(211,209,199)">State sₜ</text>
<text x="150" y="58" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(180,178,169)">joint pos / vel · phase φ</text>

<!-- Policy -->
<rect x="45" y="104" width="210" height="52" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="1"/>
<text x="150" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(206,203,246)">Policy π(a∣s)</text>
<text x="150" y="142" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(175,169,236)">neural net · 30 Hz</text>

<!-- PD targets -->
<rect x="45" y="188" width="210" height="52" rx="8" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="1"/>
<text x="150" y="210" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(181,212,244)">PD target angles āₜ</text>
<text x="150" y="226" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(133,183,235)">a pose to aim for, not torque</text>

<!-- Physics -->
<rect x="45" y="272" width="210" height="58" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="1"/>
<text x="150" y="294" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(250,199,117)">Physics — forward dynamics</text>
<text x="150" y="312" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(239,159,39)">torque → contact → integrate · 1.2 kHz</text>

<!-- column arrows -->
<line x1="150" y1="72" x2="150" y2="104" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="150" y1="156" x2="150" y2="188" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="150" y1="240" x2="150" y2="272" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- loopback -->
<path d="M45 301 L14 301 L14 46 L45 46" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text transform="translate(8,174) rotate(-90)" text-anchor="middle" font-size="10.5" fill="rgb(239,159,39)">realized pose qₜ₊₁ ≠ āₜ</text>

<!-- Reference clip -->
<rect x="445" y="20" width="200" height="52" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="1"/>
<text x="545" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(211,209,199)">Reference clip {q̂}</text>
<text x="545" y="58" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(180,178,169)">mocap or keyframe</text>

<!-- Reference pose -->
<rect x="445" y="272" width="200" height="58" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="1"/>
<text x="545" y="294" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(211,209,199)">Reference pose q̂ₜ</text>
<text x="545" y="312" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(180,178,169)">just data — no physics</text>

<line x1="545" y1="72" x2="545" y2="272" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="558" y="176" text-anchor="start" font-size="11" fill="rgb(180,178,169)">sampled at phase φ</text>

<!-- FK boxes -->
<rect x="60" y="386" width="170" height="52" rx="8" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="1"/>
<text x="145" y="405" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(181,212,244)">Forward kinematics</text>
<text x="145" y="421" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(133,183,235)">angles → world positions</text>

<rect x="460" y="386" width="170" height="52" rx="8" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="1"/>
<text x="545" y="405" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(181,212,244)">Forward kinematics</text>
<text x="545" y="421" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(133,183,235)">angles → world positions</text>

<!-- pose -> FK -->
<line x1="150" y1="330" x2="146" y2="386" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="160" y="360" text-anchor="start" font-size="10.5" fill="rgb(180,178,169)">simulated pose qₜ</text>
<line x1="545" y1="330" x2="545" y2="386" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Common space -->
<rect x="230" y="462" width="220" height="54" rx="8" fill="rgb(114,36,62)" stroke="rgb(237,147,177)" stroke-width="1"/>
<text x="340" y="481" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(244,192,209)">Common space</text>
<text x="340" y="498" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(237,147,177)">link · end-effector · CoM positions</text>

<path d="M145 438 L145 489 L230 489" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M545 438 L545 489 L450 489" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Reward -->
<rect x="270" y="544" width="140" height="44" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="1"/>
<text x="340" y="566" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(206,203,246)">Imitation reward rᴵ</text>
<line x1="340" y1="516" x2="340" y2="544" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

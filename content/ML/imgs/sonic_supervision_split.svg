<svg width="100%" viewBox="0 0 680 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SONIC supervision split: PPO updates D_c, auxiliary losses update D_r, shared trunk updated by both</title>
<desc>The motion command g is encoded and quantized into token z by a shared trunk. From z, two decoder heads branch: D_c produces the single-frame action a_t and is supervised by the PPO reward; D_r reconstructs a 10-frame motion chunk and is supervised by the reconstruction, token-alignment, and cycle losses. The encoder and quantizer trunk receives gradient from both loss families.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,'Segoe UI',sans-serif}
.arw{stroke:var(--line);stroke-width:1.6;fill:none}
.box{stroke-width:1.1}
.r-p{fill:var(--pf);stroke:var(--ps)}.r-t{fill:var(--tf);stroke:var(--ts)}.r-g{fill:var(--gf);stroke:var(--gs)}
.k-p{fill:var(--pt)}.k-t{fill:var(--tt)}.k-g{fill:var(--gt)}.k-or{fill:var(--ort)}
.m-p{fill:var(--ps)}.m-t{fill:var(--ts)}.m-g{fill:var(--gs)}
.title{font-size:14.5px;font-weight:500}.sub{font-size:11.5px}
.cap{font-size:12px;font-style:italic;fill:var(--muted)}
.leg{font-size:12px;fill:var(--legend)}.tag{font-size:13px;font-weight:600}
:root{--ink:#20201a;--muted:#56554f;--line:#73726c;--legend:#5f5e5a;--pf:#eeedfe;--ps:#534ab7;--pt:#3c3489;--tf:#e1f5ee;--ts:#0f6e56;--tt:#085041;--gf:#f1efe8;--gs:#5f5e5a;--gt:#444441;--ort:#7a460a}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--muted:#cbc9c0;--line:#a8a69d;--legend:#cbc9c0;--pf:#2b2552;--ps:#9387e6;--pt:#d2ccf7;--tf:#0e3b33;--ts:#46b89c;--tt:#c2ece0;--gf:#34332e;--gs:#a3a199;--gt:#d8d6cc;--ort:#f5dcae}}
</style>
</defs>

<rect x="270" y="18" width="140" height="44" rx="9" class="box r-g"/><text x="340" y="40" text-anchor="middle" class="title k-g">g — motion cmd</text><text x="340" y="56" text-anchor="middle" class="sub m-g">gᵣ / gₕ / gₘ</text>
<line x1="340" y1="62" x2="340" y2="88" class="arw" marker-end="url(#a)"/>
<rect x="248" y="88" width="184" height="50" rx="9" class="box r-t"/><text x="340" y="110" text-anchor="middle" class="title k-t">Encoder E  +  FSQ</text><text x="340" y="127" text-anchor="middle" class="sub m-t">shared trunk</text>
<line x1="340" y1="138" x2="340" y2="166" class="arw" marker-end="url(#a)"/>
<rect x="285" y="166" width="110" height="44" rx="9" class="box r-p"/><text x="340" y="193" text-anchor="middle" class="title k-p">token z</text>

<path d="M452 113 L436 113" class="arw" marker-end="url(#a)" style="stroke:var(--ort)"/>
<text x="458" y="108" class="tag k-or">trunk: updated by BOTH</text>
<text x="458" y="124" class="cap" style="fill:var(--ort)">loss families, every step</text>

<path d="M320 210 L172 252" class="arw" marker-end="url(#a)"/>
<path d="M360 210 L508 252" class="arw" marker-end="url(#a)"/>

<rect x="70" y="252" width="180" height="50" rx="9" class="box r-t"/><text x="160" y="274" text-anchor="middle" class="title k-t">D<tspan baseline-shift="sub" font-size="0.72em">c</tspan> — control decoder</text><text x="160" y="291" text-anchor="middle" class="sub m-t">+ sᵖₜ</text>
<line x1="160" y1="302" x2="160" y2="330" class="arw" marker-end="url(#a)"/>
<rect x="80" y="330" width="160" height="50" rx="9" class="box r-g"/><text x="160" y="352" text-anchor="middle" class="title k-g">aₜ — 29-dim</text><text x="160" y="369" text-anchor="middle" class="sub m-g">single frame → PD</text>
<text x="160" y="408" text-anchor="middle" class="tag k-p">updated by  &#8466;<tspan baseline-shift="sub" font-size="0.72em">ppo</tspan>  (reward)</text>

<rect x="430" y="252" width="180" height="50" rx="9" class="box r-t"/><text x="520" y="274" text-anchor="middle" class="title k-t">D<tspan baseline-shift="sub" font-size="0.72em">r</tspan> — motion decoder</text><text x="520" y="291" text-anchor="middle" class="sub m-t">token only</text>
<line x1="520" y1="302" x2="520" y2="330" class="arw" marker-end="url(#a)"/>
<rect x="440" y="330" width="160" height="50" rx="9" class="box r-g"/><text x="520" y="352" text-anchor="middle" class="title k-g">ĝᵣ — 10-frame chunk</text><text x="520" y="369" text-anchor="middle" class="sub m-g">reconstruction</text>
<text x="520" y="408" text-anchor="middle" class="tag k-t">updated by  &#8466;<tspan baseline-shift="sub" font-size="0.72em">recon</tspan> · &#8466;<tspan baseline-shift="sub" font-size="0.72em">token</tspan> · &#8466;<tspan baseline-shift="sub" font-size="0.72em">cycle</tspan></text>

<text x="340" y="448" text-anchor="middle" class="cap">PPO never touches the aux losses; the aux losses never step the simulator. Only the trunk (E + quantizer) sees both.</text>
<text x="340" y="476" text-anchor="middle" class="leg">Purple = token · Teal = learned net · Gray = data</text>
</svg>

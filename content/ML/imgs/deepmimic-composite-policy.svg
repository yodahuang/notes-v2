<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, system-ui, &quot;Segoe UI&quot;, sans-serif">
<title>DeepMimic composite policy: a value-function gate over independent experts</title>
<desc>Several expert policies are trained separately, each with its own value function. At runtime the current state is fed to every expert, and a selector picks the next skill by a softmax over their value estimates. The chosen expert's action drives the physics, advancing the state, and the selection repeats each step. No gate is ever trained — the value functions are the gate.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- State -->
<rect x="24" y="150" width="132" height="60" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="1"/>
<text x="90" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(211,209,199)">Current state sₜ</text>
<text x="90" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(180,178,169)">physical, post-fall, etc.</text>

<!-- Experts -->
<rect x="224" y="60" width="206" height="52" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="1"/>
<text x="327" y="79" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(206,203,246)">Expert π₁ — walk</text>
<text x="327" y="96" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(175,169,236)">value V₁(s)</text>

<rect x="224" y="154" width="206" height="52" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="1"/>
<text x="327" y="173" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(206,203,246)">Expert π₂ — getup</text>
<text x="327" y="190" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(175,169,236)">value V₂(s)</text>

<rect x="224" y="248" width="206" height="52" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="1"/>
<text x="327" y="267" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(206,203,246)">Expert π₃ — roll</text>
<text x="327" y="284" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(175,169,236)">value V₃(s)</text>

<text x="327" y="328" text-anchor="middle" font-size="11" fill="rgb(180,178,169)">trained independently · never told about each other</text>

<!-- state -> experts -->
<path d="M156 180 L190 180 L190 86 L224 86" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M156 180 L224 180" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M156 180 L190 180 L190 274 L224 274" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Selector -->
<rect x="490" y="150" width="170" height="60" rx="8" fill="rgb(114,36,62)" stroke="rgb(237,147,177)" stroke-width="1"/>
<text x="575" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(244,192,209)">Pick by softmax Vᵢ</text>
<text x="575" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(237,147,177)">T = 0.3 · no immediate repeat</text>

<!-- experts -> selector -->
<path d="M430 86 L460 86 L460 178 L490 178" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M430 180 L490 180" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M430 274 L460 274 L460 182 L490 182" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460" y="138" text-anchor="middle" font-size="10.5" fill="rgb(180,178,169)">value estimates = the gate</text>

<!-- Physics on return path -->
<rect x="300" y="350" width="150" height="40" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="1"/>
<text x="375" y="370" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(250,199,117)">physics step</text>

<!-- selector -> physics -> state loop -->
<path d="M575 210 L575 370 L450 370" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="588" y="290" text-anchor="start" font-size="10.5" fill="rgb(239,159,39)">winner's action aₜ</text>
<path d="M300 370 L90 370 L90 210" fill="none" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="195" y="386" text-anchor="middle" font-size="10.5" fill="rgb(180,178,169)">advance · re-select every step</text>
</svg>

<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SONIC keyframe module: three paths constructing an end keyframe for the planner</title>
<desc>From the current robot state (start keyframe), three command types build an end keyframe differently. Navigation uses a spring model then transplants a random style clip onto the computed root trajectory. Height skills retrieve a single frame at the target pelvis height. Boxing selects the most expressive frame of a matching clip. All three feed the masked-inpainting planner, which fills the motion between start and end keyframe.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,'Segoe UI',sans-serif}
.arw{stroke:var(--line);stroke-width:1.6;fill:none}
.arwd{stroke:var(--line);stroke-width:1.4;fill:none;stroke-dasharray:5 4}
.box{stroke-width:1.1}
.r-p{fill:var(--pf);stroke:var(--ps)}.r-t{fill:var(--tf);stroke:var(--ts)}.r-g{fill:var(--gf);stroke:var(--gs)}.r-gn{fill:var(--gnf);stroke:var(--gns)}.r-or{fill:var(--orf);stroke:var(--ors)}
.k-p{fill:var(--pt)}.k-t{fill:var(--tt)}.k-g{fill:var(--gt)}.k-gn{fill:var(--gnt)}.k-or{fill:var(--ort)}
.m-p{fill:var(--ps)}.m-t{fill:var(--ts)}.m-g{fill:var(--gs)}.m-gn{fill:var(--gns)}.m-or{fill:var(--ors)}
.title{font-size:13.5px;font-weight:500}.sub{font-size:11px}.hdr{font-size:13.5px;font-weight:600}
.cap{font-size:11.5px;font-style:italic;fill:var(--muted)}
.leg{font-size:12px;fill:var(--legend)}
:root{--ink:#20201a;--muted:#56554f;--line:#73726c;--legend:#5f5e5a;--pf:#eeedfe;--ps:#534ab7;--pt:#3c3489;--tf:#e1f5ee;--ts:#0f6e56;--tt:#085041;--gf:#f1efe8;--gs:#5f5e5a;--gt:#444441;--gnf:#e6f4e6;--gns:#23783c;--gnt:#155a2d;--orf:#faefde;--ors:#a86210;--ort:#7a460a}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--muted:#cbc9c0;--line:#a8a69d;--legend:#cbc9c0;--pf:#2b2552;--ps:#9387e6;--pt:#d2ccf7;--tf:#0e3b33;--ts:#46b89c;--tt:#c2ece0;--gf:#34332e;--gs:#a3a199;--gt:#d8d6cc;--gnf:#123c21;--gns:#54bd73;--gnt:#c5e9cd;--orf:#3f2b0d;--ors:#dca044;--ort:#f5dcae}}
</style>
</defs>

<rect x="240" y="18" width="200" height="48" rx="9" class="box r-g"/><text x="340" y="40" text-anchor="middle" class="title k-g">Current robot state</text><text x="340" y="57" text-anchor="middle" class="sub m-g">start keyframe · last 4 frames</text>
<path d="M280 66 L120 112" class="arwd" marker-end="url(#a)"/>
<path d="M340 66 L340 112" class="arwd" marker-end="url(#a)"/>
<path d="M400 66 L560 112" class="arwd" marker-end="url(#a)"/>

<text x="110" y="104" text-anchor="middle" class="hdr m-p">PATH A · Navigation</text>
<text x="340" y="104" text-anchor="middle" class="hdr m-gn">PATH B · Height skills</text>
<text x="570" y="104" text-anchor="middle" class="hdr m-or">PATH C · Boxing</text>

<rect x="20" y="116" width="180" height="46" rx="9" class="box r-g"/><text x="110" y="137" text-anchor="middle" class="title k-g">Nav command</text><text x="110" y="153" text-anchor="middle" class="sub m-g">velocity · direction · style</text>
<line x1="110" y1="162" x2="110" y2="186" class="arw" marker-end="url(#a)"/>
<rect x="20" y="186" width="180" height="50" rx="9" class="box r-p"/><text x="110" y="208" text-anchor="middle" class="title k-p">Spring model</text><text x="110" y="225" text-anchor="middle" class="sub m-p">v, θ → root pos + heading @ t+1s</text>
<line x1="110" y1="236" x2="110" y2="260" class="arw" marker-end="url(#a)"/>
<rect x="20" y="260" width="180" height="46" rx="9" class="box r-p"/><text x="110" y="281" text-anchor="middle" class="title k-p">Style clip lookup</text><text x="110" y="297" text-anchor="middle" class="sub m-p">random seg from library</text>
<line x1="110" y1="306" x2="110" y2="330" class="arw" marker-end="url(#a)"/>
<rect x="20" y="330" width="180" height="46" rx="9" class="box r-p"/><text x="110" y="351" text-anchor="middle" class="title k-p">Place at root traj</text><text x="110" y="367" text-anchor="middle" class="sub m-p">transplant the segment</text>
<line x1="110" y1="376" x2="110" y2="430" class="arw" marker-end="url(#a)"/>
<rect x="20" y="430" width="180" height="48" rx="9" class="box r-t"/><text x="110" y="452" text-anchor="middle" class="title k-t">End keyframe</text><text x="110" y="469" text-anchor="middle" class="sub m-t">style pose at root loc</text>

<rect x="250" y="116" width="180" height="46" rx="9" class="box r-g"/><text x="340" y="137" text-anchor="middle" class="title k-g">Height command</text><text x="340" y="153" text-anchor="middle" class="sub m-g">target pelvis height</text>
<line x1="340" y1="162" x2="340" y2="186" class="arw" marker-end="url(#a)"/>
<rect x="250" y="186" width="180" height="46" rx="9" class="box r-gn"/><text x="340" y="207" text-anchor="middle" class="title k-gn">Library lookup</text><text x="340" y="223" text-anchor="middle" class="sub m-gn">single clip per skill</text>
<line x1="340" y1="232" x2="340" y2="260" class="arw" marker-end="url(#a)"/>
<rect x="250" y="260" width="180" height="46" rx="9" class="box r-gn"/><text x="340" y="281" text-anchor="middle" class="title k-gn">Frame retrieval</text><text x="340" y="297" text-anchor="middle" class="sub m-gn">frame at target height</text>
<line x1="340" y1="306" x2="340" y2="430" class="arw" marker-end="url(#a)"/>
<text x="340" y="372" text-anchor="middle" class="cap">(no root-trajectory step)</text>
<rect x="250" y="430" width="180" height="48" rx="9" class="box r-t"/><text x="340" y="452" text-anchor="middle" class="title k-t">End keyframe</text><text x="340" y="469" text-anchor="middle" class="sub m-t">target-height pose, 1 frame</text>

<rect x="480" y="116" width="180" height="46" rx="9" class="box r-g"/><text x="570" y="137" text-anchor="middle" class="title k-g">Action command</text><text x="570" y="153" text-anchor="middle" class="sub m-g">jab · hook · stance</text>
<line x1="570" y1="162" x2="570" y2="186" class="arw" marker-end="url(#a)"/>
<rect x="480" y="186" width="180" height="46" rx="9" class="box r-or"/><text x="570" y="207" text-anchor="middle" class="title k-or">Clip selection</text><text x="570" y="223" text-anchor="middle" class="sub m-or">clip for action label</text>
<line x1="570" y1="232" x2="570" y2="260" class="arw" marker-end="url(#a)"/>
<rect x="480" y="260" width="180" height="46" rx="9" class="box r-or"/><text x="570" y="281" text-anchor="middle" class="title k-or">Expressiveness pick</text><text x="570" y="297" text-anchor="middle" class="sub m-or">frame of max arm extension</text>
<line x1="570" y1="306" x2="570" y2="430" class="arw" marker-end="url(#a)"/>
<text x="570" y="372" text-anchor="middle" class="cap">(no root traj, stays in place)</text>
<rect x="480" y="430" width="180" height="48" rx="9" class="box r-t"/><text x="570" y="452" text-anchor="middle" class="title k-t">End keyframe</text><text x="570" y="469" text-anchor="middle" class="sub m-t">peak pose of action</text>

<path d="M110 478 L280 524" class="arw" marker-end="url(#a)"/>
<path d="M340 478 L340 524" class="arw" marker-end="url(#a)"/>
<path d="M570 478 L400 524" class="arw" marker-end="url(#a)"/>
<rect x="160" y="524" width="360" height="50" rx="9" class="box r-p"/><text x="340" y="547" text-anchor="middle" class="title k-p">Masked-inpainting planner</text><text x="340" y="565" text-anchor="middle" class="sub m-p">fills 0.8-2.4 s of whole-body motion between start and end keyframe</text>

<text x="340" y="594" text-anchor="middle" class="leg">Every path: start keyframe known · end keyframe = one coarse pose · middle masked, planner generalizes</text>
</svg>

<svg width="100%" viewBox="0 0 680 270" role="img" xmlns="http://www.w3.org/2000/svg">
<title>PPO clipped surrogate objective shape</title>
<desc>Two panels showing L-CLIP versus the unclipped L-CPI as the probability ratio r moves away from 1. For positive advantage the objective flatlines past 1+epsilon; for negative advantage it flatlines below 1-epsilon but keeps penalizing past it.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,sans-serif}
.axis{stroke:var(--line);stroke-width:1.3;fill:none}
.cpi{stroke:var(--cpi);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.clip{stroke:var(--clip);stroke-width:2.6;fill:none;stroke-linejoin:round}
.guide{stroke:var(--guide);stroke-width:1;fill:none;stroke-dasharray:2 3}
.dot{fill:var(--clip)}
.title{font-size:14px;font-weight:500;fill:var(--ink)}
.tick{font-size:11px;fill:var(--legend)}
.lab{font-size:11.5px;font-weight:500}
.k-cpi{fill:var(--cpi)}.k-clip{fill:var(--clip)}
.cap{font-size:11.5px;fill:var(--legend)}
:root{--ink:#20201a;--line:#73726c;--legend:#5f5e5a;--guide:#bdbcb5;--cpi:#8a6d3b;--clip:#1f7a70}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--line:#a8a69d;--legend:#cbc9c0;--guide:#54534d;--cpi:#d8b06a;--clip:#4fc7ba}}
</style>
</defs>

<!-- ================= LEFT PANEL: A > 0 ================= -->
<text class="title" x="180" y="26" text-anchor="middle">A &gt; 0  (good action → push r up)</text>
<!-- axes -->
<path class="axis" d="M55 210 L315 210" marker-end="url(#ar)"/>
<path class="axis" d="M55 210 L55 52" marker-end="url(#ar)"/>
<text class="tick" x="318" y="214">r</text>
<text class="tick" x="48" y="56" text-anchor="end">L</text>
<!-- guides at 1-e, 1, 1+e -->
<path class="guide" d="M120 210 L120 118"/>
<path class="guide" d="M180 210 L180 130"/>
<path class="guide" d="M240 210 L240 95"/>
<text class="tick" x="120" y="224" text-anchor="middle">1−ε</text>
<text class="tick" x="180" y="224" text-anchor="middle">1</text>
<text class="tick" x="240" y="224" text-anchor="middle">1+ε</text>
<!-- CPI (unclipped line) -->
<path class="cpi" d="M60 200 L300 60"/>
<!-- CLIP: follows line then flatlines past 1+e -->
<path class="clip" d="M60 200 L240 95 L300 95"/>
<!-- start dot at r=1 -->
<circle class="dot" cx="180" cy="130" r="3.2"/>
<text class="lab k-clip" x="248" y="90">L<tspan baseline-shift="super" font-size="0.7em">CLIP</tspan></text>
<text class="lab k-cpi" x="266" y="54">L<tspan baseline-shift="super" font-size="0.7em">CPI</tspan></text>

<!-- ================= RIGHT PANEL: A < 0 ================= -->
<text class="title" x="500" y="26" text-anchor="middle">A &lt; 0  (bad action → push r down)</text>
<path class="axis" d="M375 60 L375 210"/>
<path class="axis" d="M375 210 L635 210" marker-end="url(#ar)"/>
<text class="tick" x="638" y="214">r</text>
<text class="tick" x="368" y="64" text-anchor="end">L</text>
<!-- guides at 1-e, 1, 1+e -->
<path class="guide" d="M440 210 L440 95"/>
<path class="guide" d="M500 210 L500 130"/>
<path class="guide" d="M560 210 L560 178"/>
<text class="tick" x="440" y="224" text-anchor="middle">1−ε</text>
<text class="tick" x="500" y="224" text-anchor="middle">1</text>
<text class="tick" x="560" y="224" text-anchor="middle">1+ε</text>
<!-- CPI (unclipped line), decreasing -->
<path class="cpi" d="M380 60 L620 200"/>
<!-- CLIP: flat below 1-e, then follows line down (penalty stays) -->
<path class="clip" d="M380 95 L440 95 L620 200"/>
<circle class="dot" cx="500" cy="130" r="3.2"/>
<text class="lab k-clip" x="384" y="88">L<tspan baseline-shift="super" font-size="0.7em">CLIP</tspan></text>
<text class="lab k-cpi" x="588" y="196">L<tspan baseline-shift="super" font-size="0.7em">CPI</tspan></text>

<text class="cap" x="180" y="252" text-anchor="middle">flat past 1+ε → no reward for overshooting</text>
<text class="cap" x="500" y="252" text-anchor="middle">flat below 1−ε, but penalty resumes past it</text>
</svg>

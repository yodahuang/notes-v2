<svg width="100%" viewBox="0 0 680 630" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Reconstruction loss vs cycle loss in SONIC's encoder-decoder, traced along the human-token path</title>
<desc>z_h is decoded by D_r into reconstructed robot motion ghat_r. Reconstruction loss compares ghat_r directly to ground-truth motion g_r in pose space. Separately, ghat_r is re-encoded by E_r into a new token z_r-prime, and cycle loss compares it to the ground-truth token z_r in token space.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,'Segoe UI',sans-serif}
.arw{stroke:var(--line);stroke-width:1.6;fill:none}
.arwd{stroke:var(--line);stroke-width:1.4;fill:none;stroke-dasharray:5 4}
.box{stroke-width:1.1}
.r-p{fill:var(--pf);stroke:var(--ps)}.r-t{fill:var(--tf);stroke:var(--ts)}.r-g{fill:var(--gf);stroke:var(--gs)}.r-gn{fill:var(--gnf);stroke:var(--gns)}.r-or{fill:var(--orf);stroke:var(--ors)}
.k-p{fill:var(--pt)}.k-t{fill:var(--tt)}.k-g{fill:var(--gt)}.k-gn{fill:var(--gnt)}.k-or{fill:var(--ort)}
.m-p{fill:var(--ps)}.m-t{fill:var(--ts)}.m-g{fill:var(--gs)}.m-gn{fill:var(--gns)}.m-or{fill:var(--ors)}
.title{font-size:15px;font-weight:500}.sub{font-size:12px}.hdr{font-size:14px;font-weight:600}
.cap{font-size:12px;font-style:italic;fill:var(--muted)}.capb{font-size:13px;font-weight:600;fill:var(--ink)}
.leg{font-size:12px;fill:var(--legend)}.tag{font-size:13px;font-weight:600}.rowlab{font-size:14.5px;font-weight:500;fill:var(--ink)}
.band-hi{stroke:var(--bhi);stroke-width:1;fill:none;stroke-dasharray:5 4}.band-lo{stroke:var(--blo);stroke-width:1;fill:none;stroke-dasharray:5 4}
:root{--ink:#20201a;--muted:#56554f;--line:#73726c;--legend:#5f5e5a;--pf:#eeedfe;--ps:#534ab7;--pt:#3c3489;--tf:#e1f5ee;--ts:#0f6e56;--tt:#085041;--gf:#f1efe8;--gs:#5f5e5a;--gt:#444441;--gnf:#e6f4e6;--gns:#23783c;--gnt:#155a2d;--orf:#faefde;--ors:#a86210;--ort:#7a460a;--bhi:#b9b3d8;--blo:#9fc7bb}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--muted:#cbc9c0;--line:#a8a69d;--legend:#cbc9c0;--pf:#2b2552;--ps:#9387e6;--pt:#d2ccf7;--tf:#0e3b33;--ts:#46b89c;--tt:#c2ece0;--gf:#34332e;--gs:#a3a199;--gt:#d8d6cc;--gnf:#123c21;--gns:#54bd73;--gnt:#c5e9cd;--orf:#3f2b0d;--ors:#dca044;--ort:#f5dcae;--bhi:#6f64b3;--blo:#46967f}}
</style>
</defs>

<line x1="340" y1="96" x2="340" y2="128" class="arw" marker-end="url(#a)"/>
<line x1="340" y1="186" x2="340" y2="218" class="arw" marker-end="url(#a)"/>
<path d="M290 276 L290 310 L140 310 L140 338" class="arwd"/>
<path d="M390 276 L390 310 L535 310 L535 338" class="arw" marker-end="url(#a)"/>
<line x1="535" y1="396" x2="535" y2="428" class="arw" marker-end="url(#a)"/>
<line x1="535" y1="486" x2="535" y2="518" class="arwd"/>

<text x="215" y="300" text-anchor="middle" class="capb">&#8466;<tspan baseline-shift="sub" font-size="0.72em">recon</tspan></text>
<text x="548" y="503" text-anchor="start" class="capb">&#8466;<tspan baseline-shift="sub" font-size="0.72em">cycle</tspan></text>

<rect x="250" y="40" width="180" height="56" rx="9" class="box r-p"/>
<text x="340" y="64" text-anchor="middle" class="title k-p">zₕ</text>
<text x="340" y="82" text-anchor="middle" class="sub m-p">human-derived token</text>

<rect x="245" y="130" width="190" height="56" rx="9" class="box r-t"/>
<text x="340" y="154" text-anchor="middle" class="title k-t">Dᵣ</text>
<text x="340" y="172" text-anchor="middle" class="sub m-t">robot motion decoder</text>

<rect x="245" y="220" width="190" height="56" rx="9" class="box r-g"/>
<text x="340" y="244" text-anchor="middle" class="title k-g">ĝᵣ</text>
<text x="340" y="262" text-anchor="middle" class="sub m-g">reconstructed motion</text>

<rect x="50" y="340" width="180" height="56" rx="9" class="box r-g"/>
<text x="140" y="364" text-anchor="middle" class="title k-g">gᵣ</text>
<text x="140" y="382" text-anchor="middle" class="sub m-g">ground-truth motion</text>

<rect x="445" y="340" width="180" height="56" rx="9" class="box r-t"/>
<text x="535" y="364" text-anchor="middle" class="title k-t">Eᵣ</text>
<text x="535" y="382" text-anchor="middle" class="sub m-t">robot motion encoder</text>

<rect x="455" y="430" width="160" height="56" rx="9" class="box r-p"/>
<text x="535" y="454" text-anchor="middle" class="title k-p">zᵣ′</text>
<text x="535" y="472" text-anchor="middle" class="sub m-p">re-encoded token</text>

<rect x="445" y="520" width="180" height="56" rx="9" class="box r-p"/>
<text x="535" y="544" text-anchor="middle" class="title k-p">zᵣ</text>
<text x="535" y="562" text-anchor="middle" class="sub m-p">ground-truth token</text>

<text x="340" y="608" text-anchor="middle" class="leg">Purple = token space · Teal = encoder / decoder · Gray = pose space · dashed = comparison</text>
</svg>

<svg width="100%" viewBox="0 0 680 299" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RTC vs ARLI</title><desc>Left: in RTC, the frozen denoiser receives the stale state, Gaussian noise and the committed actions, which pin the first d actions via inpainting, so the new chunk is smooth at the seam. Right: in ARLI, a small learned policy reads the stale state, the committed actions and a fresher mid-inference observation and outputs the noise w; the frozen policy denoises it (optionally with RTC inpainting).</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hatch-bg"/><path d="M0 0V6" class="hatch-ln"/></pattern>

<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,sans-serif;fill:var(--ink)}
.s{font-size:0.72em}.b{font-weight:600}
.box{stroke-width:1.1}.chip{stroke-width:1}.dash{stroke-dasharray:5 4}
.arw{stroke:var(--line);stroke-width:1.5;fill:none}
.band{fill:none;stroke:var(--band);stroke-width:1.2}
.ax{stroke:var(--line);stroke-width:1.2;fill:none}.tk{stroke:var(--line);stroke-width:1}
.ln{stroke:var(--line);stroke-width:1.2;fill:none}
.cell{fill:var(--gf);stroke:var(--gs);stroke-width:0.8}
.hatch-bg{fill:var(--pf)}.hatch-ln{stroke:var(--ps);stroke-width:1.6;opacity:0.35}
.hatch{fill:url(#hatch);stroke:var(--ps);stroke-width:1.2}
.cross{stroke:var(--os);stroke-width:2;fill:none}
.r-g{fill:var(--gf);stroke:var(--gs)}.k-g{fill:var(--gt)}.f-g{fill:var(--gf)}.d-g{fill:var(--gs)}.s-g{stroke:var(--gs);fill:none}.bar-g{fill:var(--gf);stroke:var(--gs);stroke-width:0.7}
.r-t{fill:var(--tf);stroke:var(--ts)}.k-t{fill:var(--tt)}.f-t{fill:var(--tf)}.d-t{fill:var(--ts)}.s-t{stroke:var(--ts);fill:none}.bar-t{fill:var(--tf);stroke:var(--ts);stroke-width:0.7}
.r-p{fill:var(--pf);stroke:var(--ps)}.k-p{fill:var(--pt)}.f-p{fill:var(--pf)}.d-p{fill:var(--ps)}.s-p{stroke:var(--ps);fill:none}.bar-p{fill:var(--pf);stroke:var(--ps);stroke-width:0.7}
.r-e{fill:var(--ef);stroke:var(--es)}.k-e{fill:var(--et)}.f-e{fill:var(--ef)}.d-e{fill:var(--es)}.s-e{stroke:var(--es);fill:none}.bar-e{fill:var(--ef);stroke:var(--es);stroke-width:0.7}
.r-o{fill:var(--of);stroke:var(--os)}.k-o{fill:var(--ot)}.f-o{fill:var(--of)}.d-o{fill:var(--os)}.s-o{stroke:var(--os);fill:none}.bar-o{fill:var(--of);stroke:var(--os);stroke-width:0.7}
.hd{font-size:15px;font-weight:600;fill:var(--ink)}.title{font-size:14px;font-weight:600}.sub{font-size:11.5px}.lead{font-size:13.5px;font-weight:600;fill:var(--ink)}.ex{font-size:12.5px;fill:var(--body)}.leg{font-size:12px;fill:var(--legend)}.legb{font-size:12px;font-weight:600;fill:var(--ink)}.ct{font-size:11.5px}.tiny{font-size:11px;fill:var(--legend)}.tinyb{font-size:11px;font-weight:600;fill:var(--ink)}.micro{font-size:9px;fill:var(--legend)}
.arp{stroke:var(--ps);stroke-width:1.5;fill:none}.art{stroke:var(--ts);stroke-width:1.5;fill:none}
:root{--ink:#20201a;--body:#3d3d38;--line:#73726c;--legend:#5f5e5a;--band:#c9c7bf;--gf:#f1efe8;--gs:#888780;--gt:#2c2c2a;--tf:#e1f5ee;--ts:#0f6e56;--tt:#085041;--pf:#eeedfe;--ps:#534ab7;--pt:#3c3489;--ef:#eaf3de;--es:#3b6d11;--et:#27500a;--of:#faece7;--os:#993c1d;--ot:#712b13}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--body:#d3d1c8;--line:#a8a69d;--legend:#cbc9c0;--band:#5a5953;--gf:#2c2c2a;--gs:#b4b2a9;--gt:#e9e7e0;--tf:#0f3a30;--ts:#5dcaa5;--tt:#c9efe2;--pf:#2b2552;--ps:#9387e6;--pt:#d2ccf7;--ef:#213414;--es:#8fc75a;--et:#d6ecbf;--of:#3d1f14;--os:#e8835e;--ot:#f6cfbf}}
</style>
</defs>
<g transform="translate(4 4)">
<rect class="band" x="0" y="0" width="329" height="279.7" rx="10"/>
<g transform="translate(12 12)">
<text class="hd" x="0" y="14.8">RTC</text>
<g transform="translate(0 30.7)">
<text class="ex" x="0" y="12.2">Committed actions are a constraint on the output:</text>
<text class="ex" x="0" y="29.2">keep the new chunk continuous with what is</text>
<text class="ex" x="0" y="46.2">already playing.</text>
<g transform="translate(0 61)">
<rect class="chip r-g" x="0" y="0" width="64" height="22" rx="11"/>
<text class="ct k-g" x="32" y="15" text-anchor="middle">s<tspan class="s" baseline-shift="sub">t−d</tspan></text>
<rect class="chip r-g" x="76" y="0" width="92" height="22" rx="11"/>
<text class="ct k-g" x="122" y="15" text-anchor="middle">w ∼ N(0, I)</text>
<rect class="chip r-p" x="184" y="0" width="112" height="22" rx="11"/>
<text class="ct k-p" x="240" y="15" text-anchor="middle">a<tspan class="s" baseline-shift="sub">t−d:t−1</tspan></text>
<rect class="box r-g" x="20" y="66" width="260" height="44" rx="8"/>
<text class="ct" x="150" y="86" text-anchor="middle">π<tspan class="s" baseline-shift="sub">PT</tspan>  (frozen denoiser)</text>
<text class="tiny k-p" x="150" y="101" text-anchor="middle">inpaint: first d actions pinned</text>
<path class="arw" d="M32 23L32 64" marker-end="url(#a)"/>
<path class="arw" d="M122 23L122 64" marker-end="url(#a)"/>
<path class="arp" d="M240 23L240 64" marker-end="url(#a)"/>
<text class="tiny k-p" x="234" y="48" text-anchor="end">as constraint</text>
<path class="arw" d="M150 112L150 140" marker-end="url(#a)"/>
<rect class="chip r-e" x="75" y="142" width="150" height="22" rx="11"/>
<text class="ct k-e" x="150" y="157" text-anchor="middle">A<tspan class="s" baseline-shift="sub">t</tspan>, smooth at the seam</text>
</g>
</g>
</g>
<g transform="translate(343 0)">
<rect class="band" x="0" y="0" width="329" height="290.7" rx="10"/>
<g transform="translate(12 12)">
<text class="hd" x="0" y="14.8">ARLI</text>
<g transform="translate(0 30.7)">
<text class="ex" x="0" y="12.2">Committed actions (and s<tspan class="s" baseline-shift="sub">mid</tspan>) are information for a</text>
<text class="ex" x="0" y="29.2">learned policy that chooses the noise.</text>
<g transform="translate(0 44)">
<rect class="chip r-g" x="0" y="0" width="64" height="22" rx="11"/>
<text class="ct k-g" x="32" y="15" text-anchor="middle">s<tspan class="s" baseline-shift="sub">t−d</tspan></text>
<rect class="chip r-p" x="72" y="0" width="100" height="22" rx="11"/>
<text class="ct k-p" x="122" y="15" text-anchor="middle">a<tspan class="s" baseline-shift="sub">t−d:t−1</tspan></text>
<rect class="chip r-t" x="180" y="0" width="64" height="22" rx="11"/>
<text class="ct k-t" x="212" y="15" text-anchor="middle">s<tspan class="s" baseline-shift="sub">mid</tspan></text>
<rect class="box r-t" x="60" y="44" width="130" height="30" rx="8"/>
<text class="ct k-t" x="125" y="64" text-anchor="middle">π<tspan class="s" baseline-shift="sub">RL</tspan>  (learned)</text>
<path class="arw" d="M32 23V34H80V42" marker-end="url(#a)"/>
<path class="arw" d="M122 23V34H122V42" marker-end="url(#a)"/>
<path class="arw" d="M212 23V34H170V42" marker-end="url(#a)"/>
<rect class="box r-g" x="20" y="104" width="260" height="44" rx="8"/>
<text class="ct" x="150" y="124" text-anchor="middle">π<tspan class="s" baseline-shift="sub">PT</tspan>  (frozen)</text>
<text class="tiny k-p" x="150" y="139" text-anchor="middle">+ RTC inpainting, optional</text>
<path class="art" d="M125 76L125 102" marker-end="url(#a)"/>
<text class="tinyb k-t" x="131" y="94">w</text>
<path class="arw" d="M6 23V126H18" marker-end="url(#a)"/>
<path class="arw" d="M150 150L150 168" marker-end="url(#a)"/>
<rect class="chip r-e" x="75" y="170" width="150" height="22" rx="11"/>
<text class="ct k-e" x="150" y="185" text-anchor="middle">A<tspan class="s" baseline-shift="sub">t</tspan>, steered by reward</text>
</g>
</g>
</g>
</g>
</g>
</svg>
<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MaskGIT-style iterative unmasking in SONIC's kinematic planner</title>
<desc>Three snapshots of a 12-token sequence across the planner's iterative refinement loop. Iteration 1 finalizes 2 of 12 tokens, nearest the known keyframes at each end. Iteration 2 finalizes 6 of 12. The final iteration finalizes all 12, following the cosine schedule that starts slow and accelerates.</desc>
<defs>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,'Segoe UI',sans-serif}
.box{stroke-width:1.1}
.r-p{fill:var(--pf);stroke:var(--ps)}.r-g{fill:var(--gf);stroke:var(--gs)}
.rowlab{font-size:14.5px;font-weight:500;fill:var(--ink)}
.leg{font-size:12px;fill:var(--legend)}
:root{--ink:#20201a;--legend:#5f5e5a;--pf:#eeedfe;--ps:#534ab7;--gf:#f1efe8;--gs:#5f5e5a}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--legend:#cbc9c0;--pf:#2b2552;--ps:#9387e6;--gf:#34332e;--gs:#a3a199}}
</style>
</defs>

<text x="140" y="48" class="rowlab">Iteration 1 — 2/12 finalized</text>
<rect x="140" y="60" width="36" height="36" rx="6" class="box r-p"/><rect x="181" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="222" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="263" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="304" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="345" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="386" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="427" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="468" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="509" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="550" y="60" width="36" height="36" rx="6" class="box r-g"/><rect x="591" y="60" width="36" height="36" rx="6" class="box r-p"/>

<text x="140" y="142" class="rowlab">Iteration 2 — 6/12 finalized</text>
<rect x="140" y="154" width="36" height="36" rx="6" class="box r-p"/><rect x="181" y="154" width="36" height="36" rx="6" class="box r-p"/><rect x="222" y="154" width="36" height="36" rx="6" class="box r-p"/><rect x="263" y="154" width="36" height="36" rx="6" class="box r-g"/><rect x="304" y="154" width="36" height="36" rx="6" class="box r-g"/><rect x="345" y="154" width="36" height="36" rx="6" class="box r-g"/><rect x="386" y="154" width="36" height="36" rx="6" class="box r-g"/><rect x="427" y="154" width="36" height="36" rx="6" class="box r-g"/><rect x="468" y="154" width="36" height="36" rx="6" class="box r-g"/><rect x="509" y="154" width="36" height="36" rx="6" class="box r-p"/><rect x="550" y="154" width="36" height="36" rx="6" class="box r-p"/><rect x="591" y="154" width="36" height="36" rx="6" class="box r-p"/>

<text x="140" y="236" class="rowlab">Iteration L (final) — 12/12 finalized</text>
<rect x="140" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="181" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="222" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="263" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="304" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="345" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="386" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="427" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="468" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="509" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="550" y="248" width="36" height="36" rx="6" class="box r-p"/><rect x="591" y="248" width="36" height="36" rx="6" class="box r-p"/>

<text x="340" y="318" text-anchor="middle" class="leg">Gray = still masked · Purple = finalized · edge positions sit nearest the known keyframes</text>
</svg>

<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Mask-enhanced anchor box initialization</title>
<desc>A selected encoder token feeds three heads; the box regressed directly is discarded as the anchor, while the predicted mask is thresholded into a tight bounding box that seeds the decoder's anchor, with the content query taken from the token embedding.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Anthropic Sans',-apple-system,system-ui,sans-serif}
.box{stroke-width:1.1}
.arw{stroke:var(--line);stroke-width:1.6;fill:none}
.arw-g{stroke:var(--grn);stroke-width:1.8;fill:none}
.arw-d{stroke:var(--line);stroke-width:1.4;fill:none;stroke-dasharray:4 3;opacity:.6}
.r-p{fill:var(--pf);stroke:var(--ps)}
.r-k{fill:var(--kf);stroke:var(--ks)}
.r-g{fill:var(--gf);stroke:var(--gs)}
.r-d{fill:var(--df);stroke:var(--ds)}
.title{font-size:14px;font-weight:500;fill:var(--ink)}
.k-p{fill:var(--pt)}.k-k{fill:var(--kt)}.k-g{fill:var(--gt)}
.sub{font-size:11px;fill:var(--ink)}
.leg{font-size:11.5px;fill:var(--legend)}
.tag{font-size:10.5px;fill:var(--legend)}
:root{--ink:#20201a;--line:#73726c;--legend:#5f5e5a;--grn:#3f8a5a;
--pf:#eeedfe;--ps:#534ab7;--pt:#3c3489;
--kf:#e3f3f0;--ks:#2f8c7e;--kt:#1f6a5f;
--gf:#e5f3e8;--gs:#3f8a5a;--gt:#2c6b42;
--df:#efeeea;--ds:#9b9a92;--dt:#6f6e67}
@media (prefers-color-scheme:dark){:root{--ink:#e9e7e0;--line:#a8a69d;--legend:#cbc9c0;--grn:#7fd39e;
--pf:#2b2552;--ps:#9387e6;--pt:#d2ccf7;
--kf:#12352f;--ks:#5fbfae;--kt:#8fe0d0;
--gf:#173521;--gs:#6db98a;--gt:#a7e6bd;
--df:#2a2a26;--ds:#77766e;--dt:#b6b5ac}}
</style>
</defs>

<!-- selected token -->
<rect class="box r-p" x="16" y="150" width="120" height="58" rx="7"/>
<text class="title k-p" x="76" y="174" text-anchor="middle">Selected token</text>
<text class="sub" x="76" y="192" text-anchor="middle">top-K by class score</text>

<!-- three heads -->
<rect class="box r-k" x="210" y="24" width="118" height="40" rx="7"/>
<text class="title k-k" x="269" y="49" text-anchor="middle">Class head</text>

<rect class="box r-k" x="210" y="150" width="118" height="40" rx="7"/>
<text class="title k-k" x="269" y="175" text-anchor="middle">Box head</text>

<rect class="box r-k" x="210" y="276" width="118" height="40" rx="7"/>
<text class="title k-k" x="269" y="301" text-anchor="middle">Mask head</text>

<path class="arw" d="M136 168 C 175 150, 178 60, 208 48" marker-end="url(#a)"/>
<path class="arw" d="M136 176 L 206 172" marker-end="url(#a)"/>
<path class="arw" d="M136 190 C 175 210, 178 300, 208 292" marker-end="url(#a)"/>

<!-- box path: discarded -->
<rect class="box r-d" x="392" y="148" width="150" height="44" rx="7"/>
<text class="sub" x="467" y="167" text-anchor="middle" fill="var(--dt)">regressed box</text>
<text class="tag" x="467" y="183" text-anchor="middle">poor at layer 0</text>
<path class="arw-d" d="M328 170 L 390 170" marker-end="url(#a)"/>
<text class="tag" x="560" y="164">✗ not used</text>
<text class="tag" x="560" y="180">as anchor</text>

<!-- mask path -->
<rect class="box r-g" x="360" y="276" width="96" height="40" rx="7"/>
<text class="sub" x="408" y="295" text-anchor="middle">predicted</text>
<text class="sub" x="408" y="309" text-anchor="middle">mask</text>
<path class="arw" d="M328 296 L 358 296" marker-end="url(#a)"/>

<rect class="box r-g" x="486" y="276" width="86" height="40" rx="7"/>
<text class="sub" x="529" y="295" text-anchor="middle">threshold</text>
<text class="sub" x="529" y="309" text-anchor="middle">→ tight bbox</text>
<path class="arw-g" d="M456 296 L 484 296" marker-end="url(#a)"/>

<!-- decoder init -->
<rect class="box r-p" x="524" y="60" width="140" height="76" rx="8"/>
<text class="title k-p" x="594" y="84" text-anchor="middle">Decoder init</text>
<text class="sub" x="594" y="104" text-anchor="middle">anchor ← mask-box</text>
<text class="sub" x="594" y="121" text-anchor="middle">content ← token emb.</text>

<!-- mask-derived box to decoder anchor -->
<path class="arw-g" d="M572 286 C 628 250, 636 170, 616 138" marker-end="url(#a)"/>
<text class="tag" x="664" y="214" text-anchor="end" fill="var(--grn)">✓ anchor</text>
<!-- content query from token embedding -->
<path class="arw" d="M96 150 C 96 40, 400 30, 524 78" marker-end="url(#a)"/>
<text class="tag" x="300" y="24">content query (token embedding, untouched by ME)</text>

<!-- caption -->
<text class="leg" x="16" y="342">Mask is easier early (per-pixel similarity) than 4-coord regression, so its</text>
<text class="leg" x="16" y="356">bbox is the better anchor. Table 9: layer-0 mask AP 25.6 → 41.2 with ME.</text>
</svg>

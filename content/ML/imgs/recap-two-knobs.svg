<svg width="100%" viewBox="0 0 680 314" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Two knobs for sharpening: epsilon at training time, beta at test time</title>
<desc>Left: a histogram of advantages with the CFGRL threshold at zero and RECAP's percentile threshold epsilon_l further right; only samples above it are labeled positive. Right: unconditional, conditional, and beta-sharpened action densities; larger beta narrows and shifts the distribution beyond the conditional mode.</desc>
